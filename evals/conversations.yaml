# Each case starts with a fresh session and a copy of the fake calendar.
# A case activates only the named bookings in fixture_overrides.active_bookings.
# Active bookings remove overlapping slots from availability. When
# bookingUidToReschedule is set, omit that booking from the occupancy check.
# open_local_starts, when supplied, limits the calendar to those fixture times.
# Seeded refs are valid before the first turn and supplied in its initial
# app context, subject to booking visibility checks. Times without offsets
# use the case time zone. Calendar booking records use UTC.
#
# tool_calls lists required calls with partial argument matches. An empty list
# imposes no required calls. forbidden_tools: ["*"] forbids every tool call.
# rejected_forbidden_tools: report_only makes a forbidden call a soft finding
# when the app rejects it. An emitted proposal or write still fails the case.
# Slot and booking selectors match resolved references, not literal ref labels.
# Offers are visible assistant refs or slot chips. A refs inventory alone is
# not an offer. source: offers_or_proposal also includes the proposed slot.
# local_dates, local_starts and time limits restrict every matching offer;
# includes_local_starts requires the listed times among the matches.
# min/max apply to distinct refs. booking_ids_in_order is an exact ordered match.
# proposal_kind: null and booking_result: null require no corresponding event.
# proposal_email checks the resolved proposal email in app state or its event.
# The model-facing arguments need not contain the attendee's address.
# An array of proposal kinds allows any listed outcome. Other null checks are
# unspecified. Each reply_patterns entry must match the visible reply.
# cal_reads lists required read operations with partial argument matches.
# cal_writes is the exact list of attempted mutations, including failed writes.
# proposal_from_turn and booking_from_turn refer to successful outputs from
# earlier turns in the same case. Turn numbers are one-based.

schema_version: 1
calendar_fixture: fake_cal.json
default_clock: "2026-11-23T10:00:00+08:00"
default_time_zone: Asia/Singapore

runs:
  serial: true
  # Provider availability decisions exclude the scripted faults in case 23.
  back_off_on_http_429: true
  default:
    model: gemini-3.5-flash-lite
    thinking_level: minimal
    repetitions_per_case: 3
    minimum_passing_repetitions: 2
    must_pass_every_repetition: [16, 18, 19, 20]
  comparison:
    model: gemini-3.8-flash
    thinking_level: low
    repetitions_per_case: 1
    minimum_passing_repetitions: 1
  switch_default_if:
    comparison_passes_more_cases: true
    comparison_provider_http_503_count: 0
  results_path: "evals/results/{model}-{date}.json"
  report_pattern_only_failures: true

all_turn_checks:
  unknown_refs: 0
  max_text_model_calls: 3
  hard_text_model_call_cap: 4
  ui_model_calls: 0
  mutations_require_action: confirm_proposal
  mutation_targets_resolve_from_server_state: true

performance_targets:
  report_only: true
  ui_server_overhead_excluding_cal_ms_max: 100
  text_turns_with_one_model_call_fraction_min: 0.70
  first_visible_feedback_ms_max: 300
  first_model_text_ms_p50_max: 1500
  text_turn_ms_p50_max: 3000
  text_turn_ms_p90_max: 6000
  report: [case_pass_rate, turn_latency_ms_p50, turn_latency_ms_p90, model_calls_per_turn, input_tokens, output_tokens, cached_tokens_per_call]

