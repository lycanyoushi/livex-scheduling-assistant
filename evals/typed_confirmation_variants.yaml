# Each literal reply confirms the visible proposal bound by proposal_from_turn.
schema_version: 1
calendar_fixture: fake_cal.json
default_clock: "2026-11-23T10:00:00+08:00"
default_time_zone: Asia/Singapore

cases:
  - id: 33
    name: Confirm the visible signed booking proposal by typing yes please
    fixture_overrides: {}
    turns:
      - &booking_request
        user: "I'm Sam, sam@example.com. Please book tomorrow at 2pm."
        checks:
          tool_calls:
            - name: propose_booking
              args: {slot_ref: {local_start: "2026-11-24T14:00"}}
          forbidden_tools: [propose_cancel, propose_reschedule]
          refs_within: null
          proposal_kind: book
          proposal_email: sam@example.com
          pending_tool_call: propose_booking
          min_model_calls: 1
          max_model_calls: 3
          cal_writes: []
          booking_result: null
      - user: "yes please"
        proposal_from_turn: 1
        checks: &confirm_booking
          tool_calls: []
          forbidden_tools: ["*"]
          refs_within: null
          proposal_kind: null
          max_model_calls: 0
          cal_writes:
            - {operation: create_booking, local_start: "2026-11-24T14:00", email: sam@example.com, outcome: success}
          booking_result: {kind: booked, local_start: "2026-11-24T14:00"}
          template: booked
  - id: 34
    name: Confirm the visible signed booking proposal by typing ok
    fixture_overrides: {}
    turns:
      - *booking_request
      - user: "ok"
        proposal_from_turn: 1
        checks: *confirm_booking
